name: ci

on:
  pull_request:
    paths:
      - "infra/**"
      - "services/**"
      - "web/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  python-tests:
    name: python unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Handlers use stdlib + boto3 (lazy-imported), so tests need no deps.
      - name: test services/api
        working-directory: services/api
        run: python -m unittest discover -v

      - name: test services/worker
        working-directory: services/worker
        run: python -m unittest discover -v

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive infra/

      # -backend=false: validate without state-backend credentials.
      # terraform validate does not accept -var flags, so required variables
      # are supplied via a throwaway auto.tfvars file (CI-only placeholders).
      - name: validate dev
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false -input=false
          cat > .ci-validate.auto.tfvars <<'EOF'
          alert_email       = "ci@example.com"
          github_repo       = "example/repo"
          state_bucket_name = "ci-placeholder-state-bucket"
          EOF
          terraform validate
          rm -f .ci-validate.auto.tfvars

      - name: validate prod
        working-directory: infra/envs/prod
        run: |
          terraform init -backend=false -input=false
          cat > .ci-validate.auto.tfvars <<'EOF'
          state_bucket_name = "ci-placeholder-state-bucket"
          EOF
          terraform validate
          rm -f .ci-validate.auto.tfvars
